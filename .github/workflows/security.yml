name: Security
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks binary and verify checksum
        env:
          VERSION: 8.24.2
        run: |
          set -euo pipefail
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl --fail --location "$base/$archive" -o "$archive"
          curl --fail --location "$base/gitleaks_${VERSION}_checksums.txt" -o checksums.txt
          grep "  $archive$" checksums.txt | sha256sum --check
          tar -xzf "$archive" gitleaks
          mkdir -p "$HOME/.local/bin"
          install gitleaks "$HOME/.local/bin/gitleaks"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: gitleaks detect --source . --no-git --redact
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
