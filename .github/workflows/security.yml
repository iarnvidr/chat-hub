name: Security
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact workflow revision and ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --quiet "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags origin "$GITHUB_SHA" '+refs/heads/*:refs/remotes/origin/*'
          git -C "$GITHUB_WORKSPACE" checkout --quiet --detach "$GITHUB_SHA"
      - name: Install pinned gitleaks binary and verify checksum
        env:
          VERSION: 8.24.2
        run: |
          set -euo pipefail
          archive="gitleaks_${VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          mkdir -p "$HOME/.local/bin"
          if curl --fail --location --retry 2 "$base/$archive" -o "$archive" \
            && curl --fail --location --retry 2 "$base/gitleaks_${VERSION}_checksums.txt" -o checksums.txt \
            && grep "  $archive$" checksums.txt | sha256sum --check; then
            tar -xzf "$archive" gitleaks
            install gitleaks "$HOME/.local/bin/gitleaks"
          else
            # GitHub's release-asset CDN has repeatedly returned HTTP 504.
            # Use Go's checksum-verified, exact-version official module instead;
            # never silently skip the secret scan or fetch a floating version.
            echo 'Pinned release asset unavailable; building pinned Gitleaks source via Go module checksum database.'
            mkdir -p "$RUNNER_TEMP/gitleaks-bin"
            GOBIN="$RUNNER_TEMP/gitleaks-bin" GOSUMDB=sum.golang.org GOTOOLCHAIN=auto \
              go install "github.com/zricethezav/gitleaks/v8@v${VERSION}"
            install "$RUNNER_TEMP/gitleaks-bin/gitleaks" "$HOME/.local/bin/gitleaks"
          fi
          "$HOME/.local/bin/gitleaks" version
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: gitleaks detect --source . --no-git --redact
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fetch exact pull request revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --quiet "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --quiet --detach "$GITHUB_SHA"
      # Narrow macOS-only exception: glib is GTK/Linux-only in this Tauri app; see docs/SECURITY-EXCEPTIONS.md.
      - name: Review dependency changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 build/dependency_review.py
