name: Rust formatting repair artifact
# Diagnostic only. This never updates a branch, signs a receipt or replaces
# the mandatory Dagger rustStyle check against the original commit.
on:
  pull_request:
    paths:
      - '**/*.rs'
      - '.github/workflows/rust-format-diagnostics.yml'
permissions:
  contents: read
concurrency:
  group: rust-format-diagnostics-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  formatting-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Fetch exact workflow revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --quiet "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --quiet --detach "$GITHUB_SHA"
      - name: Generate formatting repair without modifying any remote ref
        run: |
          set -euo pipefail
          docker run --rm --volume "$GITHUB_WORKSPACE:/src" --workdir /src \
            rust:1.99.1-bookworm@sha256:9181b56c2a21ab1d5e73cffe04fc762426d30aa7fac3c91141dd033f49a7fc8b \
            bash -ec 'rustup component add rustfmt; cargo fmt --all'
          mkdir -p artifacts/rust-format-diagnostics
          git diff --binary -- '*.rs' > artifacts/rust-format-diagnostics/rustfmt.patch
          printf '%s\n' "$GITHUB_SHA" > artifacts/rust-format-diagnostics/source-commit.txt
          git diff --stat -- '*.rs'
      - name: Retain source-bound repair patch for review
        uses: ./ci/actions/gha-artifact-upload
        with:
          name: chat-hub-rust-format-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/rust-format-diagnostics
          retention-days: 7
