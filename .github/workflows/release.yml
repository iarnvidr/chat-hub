name: Protected Chat Hub release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching the existing owner-created v-tag
        required: true
        type: string
      tag:
        description: Existing tag (for example v0.1.0); workflow never creates tags
        required: true
        type: string
      publish:
        description: Publish reviewed assets to the existing GitHub Release
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    environment:
      name: chat-hub-release
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact protected-main and existing tag/version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git check-ref-format "refs/tags/$INPUT_TAG"
          git fetch --force origin main "refs/tags/$INPUT_TAG:refs/tags/$INPUT_TAG"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD^{commit})"
          test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/main^{commit})"
          test "$(git rev-parse "refs/tags/$INPUT_TAG^{commit}")" = "$GITHUB_SHA"
          version="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          test "$version" = "$INPUT_VERSION"
          test "$INPUT_TAG" = "v$INPUT_VERSION"
          python3 - "$version" <<'PY'
          import re, sys
          assert re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", sys.argv[1]), "release version must be plain SemVer"
          PY
      - name: Build ad-hoc Apple Silicon app (not notarized)
        run: bash build/build-native-macos.sh "$RUNNER_TEMP/chat-hub"
      - name: Create updater archive, sign and verify
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          command -v npm >/dev/null
          npx --yes @tauri-apps/cli@2.10.1 signer --help
          cd "$RUNNER_TEMP/chat-hub"
          rm -f 'Chat Hub.app.tar.gz' 'Chat Hub.app.tar.gz.sig'
          tar -czf 'Chat Hub.app.tar.gz' 'Chat Hub.app'
          npx --yes @tauri-apps/cli@2.10.1 signer sign 'Chat Hub.app.tar.gz'
          test -s 'Chat Hub.app.tar.gz.sig'
          printf '%s\n' 'Updater verification requires the public key configured in src-tauri/tauri.conf.json; release must fail closed if it is still a placeholder.'
          python3 - "$GITHUB_WORKSPACE/src-tauri/tauri.conf.json" <<'PY'
          import json,sys
          key=json.load(open(sys.argv[1]))['plugins']['updater']['pubkey']
          assert key and 'PLACEHOLDER' not in key, 'configure pinned updater public key before release'
          PY
          echo "version=$INPUT_VERSION tag=$INPUT_TAG commit=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" > release-review.txt
          shasum -a 256 'Chat Hub.app.tar.gz' 'Chat Hub.app.tar.gz.sig' > SHA256SUMS
      - name: Prepare corresponding source and notices
        run: python3 build/release_sources.py prepare "$RUNNER_TEMP/chat-hub/corresponding-source"
      - name: Generate updater manifest
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${INPUT_TAG}/Chat%20Hub.app.tar.gz"
          python3 - "$INPUT_VERSION" "$url" "$RUNNER_TEMP/chat-hub/Chat Hub.app.tar.gz.sig" "$RUNNER_TEMP/chat-hub/latest.json" <<'PY'
          import base64,json,pathlib,re,sys
          version,url,sig,out=sys.argv[1:]
          assert re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)",version)
          signature=pathlib.Path(sig).read_text().strip()
          assert signature
          data={'version':version,'notes':f'Chat Hub {version}','pub_date':None,'platforms':{'darwin-aarch64':{'url':url,'signature':signature}}}
          pathlib.Path(out).write_text(json.dumps(data,indent=2)+'\n')
          PY
      - name: Create and mount-verify DMG
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: bash build/package-dmg.sh "$RUNNER_TEMP/chat-hub/Chat Hub.app" "$RUNNER_TEMP/chat-hub/corresponding-source" "$RUNNER_TEMP/chat-hub/Chat_Hub_${INPUT_VERSION}_macos-arm64.dmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-review-${{ inputs.tag }}
          path: |
            ${{ runner.temp }}/chat-hub/Chat_Hub_*.dmg
            ${{ runner.temp }}/chat-hub/Chat Hub.app.tar.gz
            ${{ runner.temp }}/chat-hub/Chat Hub.app.tar.gz.sig
            ${{ runner.temp }}/chat-hub/latest.json
            ${{ runner.temp }}/chat-hub/SHA256SUMS
            ${{ runner.temp }}/chat-hub/release-review.txt
            ${{ runner.temp }}/chat-hub/verify-macos.txt
            ${{ runner.temp }}/chat-hub/corresponding-source/**
          if-no-files-found: error
          retention-days: 30
  publish:
    if: github.ref == 'refs/heads/main' && inputs.publish
    needs: prepare
    environment:
      name: chat-hub-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-review-${{ inputs.tag }}
          path: release-assets
      - name: Upload only reviewed DMG and updater assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release view "$INPUT_TAG" >/dev/null
          dmg="release-assets/Chat_Hub_${INPUT_VERSION}_macos-arm64.dmg"
          assets=("$dmg" release-assets/latest.json 'release-assets/Chat Hub.app.tar.gz')
          for file in "${assets[@]}"; do test -s "$file"; done
          gh release upload "$INPUT_TAG" "${assets[@]}" --clobber
