name: Protected Chat Hub release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching the existing owner-created v-tag
        required: true
        type: string
      tag:
        description: Existing tag (for example v0.1.0); workflow never creates tags
        required: true
        type: string
      publish:
        description: Publish reviewed assets to the existing GitHub Release
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    environment:
      name: chat-hub-release
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact protected-main and existing tag/version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          git check-ref-format "refs/tags/$INPUT_TAG"
          git fetch --force origin main "refs/tags/$INPUT_TAG:refs/tags/$INPUT_TAG"
          test "$GITHUB_SHA" = "$(git rev-parse HEAD^{commit})"
          test "$GITHUB_SHA" = "$(git rev-parse refs/remotes/origin/main^{commit})"
          test "$(git rev-parse "refs/tags/$INPUT_TAG^{commit}")" = "$GITHUB_SHA"
          version="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          test "$version" = "$INPUT_VERSION"
          test "$INPUT_TAG" = "v$INPUT_VERSION"
          python3 - "$version" <<'PY'
          import re, sys
          assert re.fullmatch(r"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", sys.argv[1]), "release version must be plain SemVer"
          PY
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Build ad-hoc Apple Silicon Tauri app (not notarized; no Apple account)
        run: bash build/build-native-macos.sh "$RUNNER_TEMP/chat-hub"
      - name: Required startup and authenticated health smoke
        env:
          SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/chat-hub-release-evidence
        run: bash build/smoke-native-macos.sh "$RUNNER_TEMP/chat-hub/Chat Hub.app"
      - name: Upload required smoke diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat-hub-release-smoke-evidence
          path: |
            ${{ runner.temp }}/chat-hub-release-evidence/**
            ${{ runner.temp }}/chat-hub-native-launch-evidence/**
          if-no-files-found: warn
          retention-days: 30
      - name: Resolve native-smoke Cargo artifact path
        id: native-smoke-artifact
        run: |
          set -euo pipefail
          binary="$(python3 build/native_smoke_artifact.py src-tauri/Cargo.toml)"
          test -n "$binary"
          echo "binary=$binary" >> "$GITHUB_OUTPUT"
      - name: Required native-smoke feature compilation
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin --features native-smoke
      - name: Build native-smoke binary for required launch harness
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin --features native-smoke
      - name: Prepare isolated debug bundle for required launch harness
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/chat-hub-debug-smoke/Chat Hub.app"
          mkdir -p "$(dirname "$app")"
          ditto "$RUNNER_TEMP/chat-hub/Chat Hub.app" "$app"
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          binary="${{ steps.native-smoke-artifact.outputs.binary }}"
          test -x "$binary"
          cp "$binary" "$app/Contents/MacOS/$exe"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")" = "$exe"
          cmp -s "$binary" "$app/Contents/MacOS/$exe"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
      - name: Required native UI, health, relaunch, and shutdown smoke
        env:
          HOME: ${{ runner.temp }}/chat-hub-launch-home
          NATIVE_LAUNCH_EVIDENCE_DIR: ${{ runner.temp }}/chat-hub-native-launch-evidence
        run: bash build/native-launch-smoke.sh "$RUNNER_TEMP/chat-hub-debug-smoke/Chat Hub.app" "$RUNNER_TEMP/chat-hub-native-launch-evidence"
      - name: Create updater archive, sign and verify
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          command -v npm >/dev/null
          brew install minisign
          npx --yes @tauri-apps/cli@2.10.1 signer --help
          cd "$RUNNER_TEMP/chat-hub"
          rm -f 'Chat-Hub.app.tar.gz' 'Chat-Hub.app.tar.gz.sig'
          tar -czf 'Chat-Hub.app.tar.gz' 'Chat Hub.app'
          npx --yes @tauri-apps/cli@2.10.1 signer sign 'Chat-Hub.app.tar.gz'
          test -s 'Chat-Hub.app.tar.gz.sig'
          python3 - "$GITHUB_WORKSPACE/src-tauri/tauri.conf.json" "$GITHUB_WORKSPACE/build/updater_release.py" <<'PY'
          import base64, importlib.util, json, pathlib, sys
          spec=importlib.util.spec_from_file_location('updater_release', sys.argv[2])
          module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          configured=json.load(open(sys.argv[1]))['plugins']['updater']['pubkey']
          pathlib.Path('updater.pub').write_bytes(module.minisign_public_key(configured))
          sig=base64.b64decode(pathlib.Path('Chat-Hub.app.tar.gz.sig').read_bytes(), validate=True)
          pathlib.Path('Chat-Hub.app.tar.gz.sig.minisig').write_bytes(sig)
          PY
          minisign -Vm 'Chat-Hub.app.tar.gz' -p updater.pub -x 'Chat-Hub.app.tar.gz.sig.minisig'
          echo "version=$INPUT_VERSION tag=$INPUT_TAG commit=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" > release-review.txt
          shasum -a 256 'Chat-Hub.app.tar.gz' 'Chat-Hub.app.tar.gz.sig' > SHA256SUMS
      - name: Prepare corresponding source and notices
        run: python3 build/release_sources.py prepare "$RUNNER_TEMP/chat-hub/corresponding-source"
      - name: Generate updater manifest
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${INPUT_TAG}/Chat-Hub.app.tar.gz"
          python3 build/updater_release.py generate "$INPUT_VERSION" "$url" "$(cat "$RUNNER_TEMP/chat-hub/Chat-Hub.app.tar.gz.sig")" "$RUNNER_TEMP/chat-hub/latest.json" --repo "$GITHUB_REPOSITORY" --tag "$INPUT_TAG"
          python3 build/updater_release.py validate "$RUNNER_TEMP/chat-hub/latest.json"
      - name: Create and mount-verify DMG
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: bash build/package-dmg.sh "$RUNNER_TEMP/chat-hub/Chat Hub.app" "$RUNNER_TEMP/chat-hub/corresponding-source" "$RUNNER_TEMP/chat-hub/Chat_Hub_${INPUT_VERSION}_macos-arm64.dmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-review-${{ inputs.tag }}
          path: |
            ${{ runner.temp }}/chat-hub/Chat_Hub_*.dmg
            ${{ runner.temp }}/chat-hub/Chat-Hub.app.tar.gz
            ${{ runner.temp }}/chat-hub/Chat-Hub.app.tar.gz.sig
            ${{ runner.temp }}/chat-hub/latest.json
            ${{ runner.temp }}/chat-hub/SHA256SUMS
            ${{ runner.temp }}/chat-hub/release-review.txt
            ${{ runner.temp }}/chat-hub/verify-macos.txt
            ${{ runner.temp }}/chat-hub/corresponding-source/**
          if-no-files-found: error
          retention-days: 30
  publish:
    if: github.ref == 'refs/heads/main' && inputs.publish
    needs: prepare
    environment:
      name: chat-hub-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-review-${{ inputs.tag }}
          path: release-assets
      - name: Upload only reviewed DMG and updater assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release view "$INPUT_TAG" >/dev/null
          dmg="release-assets/Chat_Hub_${INPUT_VERSION}_macos-arm64.dmg"
          assets=("$dmg" release-assets/latest.json 'release-assets/Chat-Hub.app.tar.gz')
          for file in "${assets[@]}"; do test -s "$file"; done
          gh release upload "$INPUT_TAG" "${assets[@]}" --clobber
