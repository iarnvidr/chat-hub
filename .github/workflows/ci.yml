name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Linux Rust and desktop UI checks
        uses: dagger/dagger-for-github@496f1b3d8b0d823834c13e67cf8a8e08ca3b9602
        with:
          version: 0.21.11
          verb: call
          module: ./ci/dagger/check
          args: linux-checks --source .
  browser:
    name: Desktop UI browser (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Browser-test desktop UI on Linux
        run: |
          npm install --prefix "$RUNNER_TEMP/f4-playwright" --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/f4-playwright/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/f4-playwright/node_modules/playwright" node tests/desktop_ui_browser.cjs
