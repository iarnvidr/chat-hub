name: Map accepted Chat Hub macOS artifact

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "build/**"
      - "tests/native/**"
      - "src/**"
      - "crates/**"
      - "frontend/**"
      - "desktop-ui/**"
      - "ci/**"
      - "ci/actions/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "tauri.conf.json"
      - ".github/workflows/macos.yml"
      - ".github/workflows/check.yml"
      - ".github/workflows/accept-native.yml"

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: chat-hub-native-acceptance-${{ github.sha }}
  cancel-in-progress: false

jobs:
  native-build:
    runs-on: macos-15
    timeout-minutes: 60
    concurrency:
      group: chat-hub-sccache-macos-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      transport_digest: ${{ steps.native-build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fetch exact protected-main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --quiet "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags origin "$GITHUB_SHA" '+refs/heads/*:refs/remotes/origin/*'
          git -C "$GITHUB_WORKSPACE" checkout --quiet --detach "$GITHUB_SHA"
      - name: Restore trusted-main Rust compiler cache
        uses: ./ci/actions/cargo-sccache-cache
        with:
          mode: restore
          github-token: ${{ github.token }}
          platform-id: macos-15-arm64
          platform: macos-arm64
          target: aarch64-apple-darwin
      - id: native-build
        name: Build and smoke the exact merged main commit
        uses: ./ci/actions/macos-native-build
        with:
          publish-transport: 'true'
      - name: Publish bounded Rust compiler cache for protected main
        if: success()
        continue-on-error: true
        uses: ./ci/actions/cargo-sccache-cache
        with:
          mode: publish
          github-token: ${{ github.token }}
          platform-id: macos-15-arm64
          platform: macos-arm64
          target: aarch64-apple-darwin
  linux-cache-seed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: chat-hub-sccache-linux-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fetch exact protected-main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --quiet "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags origin "$GITHUB_SHA" '+refs/heads/*:refs/remotes/origin/*'
          git -C "$GITHUB_WORKSPACE" checkout --quiet --detach "$GITHUB_SHA"
      - name: Seed and verify Linux compiler cache on protected main
        uses: dagger/dagger-for-github@496f1b3d8b0d823834c13e67cf8a8e08ca3b9602
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          version: 0.21.11
          verb: call
          module: ./ci/dagger/check
          args: >-
            seed-linux-cache --source . --registry-token env:GH_TOKEN
            --repository ${{ github.repository }} --event-name ${{ github.event_name }}
            --ref ${{ github.ref }} --actor ${{ github.actor }}
            --run-id ${{ github.run_id }} --run-attempt ${{ github.run_attempt }} --sha ${{ github.sha }}
  artifact-transfer:
    needs: native-build
    if: needs.native-build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
      packages: read
    steps:
      - name: Fetch exact protected-main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --quiet "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags origin "$GITHUB_SHA" '+refs/heads/*:refs/remotes/origin/*'
          git -C "$GITHUB_WORKSPACE" checkout --quiet --detach "$GITHUB_SHA"
      - name: Install pinned ORAS client
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash build/install-oras.sh "$RUNNER_TEMP/oras"
      - name: Retrieve and verify exact main build transport
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSPORT_DIGEST: ${{ needs.native-build.outputs.transport_digest }}
        run: |
          set -euo pipefail
          test "$TRANSPORT_DIGEST" != ""
          owner="$(printf '%s' "$GITHUB_REPOSITORY" | cut -d/ -f1 | tr '[:upper:]' '[:lower:]')"
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | cut -d/ -f2 | tr '[:upper:]' '[:lower:]')"
          oras="$RUNNER_TEMP/oras/oras"
          printf '%s' "$GH_TOKEN" | "$oras" login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          "$oras" pull "ghcr.io/$owner/chat-hub-ci-$repository@$TRANSPORT_DIGEST" --output "$GITHUB_WORKSPACE/artifact-transport"
          tar -xzf "$GITHUB_WORKSPACE/artifact-transport/chat-hub-transport.tar.gz" -C "$GITHUB_WORKSPACE/artifact-transport"
          python3 - "$GITHUB_WORKSPACE/artifact-transport/transport.json" <<'PY'
          import json, os, sys
          data=json.load(open(sys.argv[1]))
          expected={"repository": os.environ["GITHUB_REPOSITORY"].lower(), "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "sha": os.environ["GITHUB_SHA"]}
          if data != expected:
              raise SystemExit("OCI transport identity does not match this main workflow run")
          PY
      - name: Upload accepted main build input
        uses: ./ci/actions/gha-artifact-upload
        with:
          name: chat-hub-native-release-main-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact-transport/chat-hub-native-release-main-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
      - name: Upload downloadable macOS build
        uses: ./ci/actions/gha-artifact-upload
        with:
          name: chat-hub-macos-arm64
          path: artifact-transport/chat-hub-macos-arm64
          retention-days: 30
  map:
    needs: [native-build, artifact-transfer]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Fetch exact main revision and ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --quiet "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags origin "$GITHUB_SHA" '+refs/heads/*:refs/remotes/origin/*'
          git -C "$GITHUB_WORKSPACE" checkout --quiet --detach "$GITHUB_SHA"
      - name: Map exact main merge to the trusted same-run native artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build/release_artifact.py promote --root "$GITHUB_WORKSPACE" --merge-sha "$GITHUB_SHA" --mapping-run-id "$GITHUB_RUN_ID"
      - uses: ./ci/actions/gha-artifact-upload
        with:
          name: chat-hub-accepted-native-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: accepted-native.json
          retention-days: 90
