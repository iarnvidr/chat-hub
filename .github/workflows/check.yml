name: Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Python contract suites (tests and build helpers)
        uses: dagger/dagger-for-github@496f1b3d8b0d823834c13e67cf8a8e08ca3b9602
        with:
          version: 0.21.11
          verb: call
          module: ./ci/dagger/check
          args: checks --source .
      - name: Record the exact successful PR check receipt
        if: github.event_name == 'pull_request'
        run: python3 build/release_artifact.py check-receipt --root "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name == 'pull_request'
        with:
          name: chat-hub-check-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/check-receipt.json
          if-no-files-found: error
          retention-days: 90
