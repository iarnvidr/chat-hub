name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
      packages: read
    steps:
      - name: Fetch exact workflow revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --quiet "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --quiet --detach "$GITHUB_SHA"
      # A public PR can validate cold, without a private engine, Dagger Cloud
      # account or package-write access. Registry credentials stay on the host.
      - name: Restore compatible compiled work from GitHub Packages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          oras="$(bash build/install-oras.sh "$RUNNER_TEMP/chat-hub-cache-oras")"
          python3 ci/scripts/oci_cache.py restore --destination ci/cache/linux-cargo --oras "$oras"
      - name: Rehydrate unchanged crate objects from their published packages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          oras="$(bash build/install-oras.sh "$RUNNER_TEMP/chat-hub-cache-oras")"
          python3 ci/scripts/crate_artifacts.py restore --destination ci/cache/linux-cargo --oras "$oras"
      - id: dagger-checks
        name: Dagger v1 crate, format, Clippy, Python, Bun and browser checks
        uses: dagger/dagger-for-github@496f1b3d8b0d823834c13e67cf8a8e08ca3b9602
        with:
          version: 1.0.0-beta.25
          verb: check
          dagger-flags: --progress plain -vv
      # A Dagger error can lack nested Bun test output in GitHub's job log.
      # Re-run only the small JavaScript suite on failure to retain actionable
      # assertions; this is diagnostics, never a replacement for dagger check.
      - name: Expose Bun test failures when the Dagger gate fails
        if: ${{ failure() && steps.dagger-checks.outcome == 'failure' && !cancelled() }}
        continue-on-error: true
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src:ro" -w /src \
            oven/bun:1.2.22@sha256:66ba69deede44e3af5dc542def218fdb3bcad2205900ea761dc5623bf973d2df \
            bash build/test-desktop-js.sh
      # A failing test must not discard successful compilation. The run/attempt
      # nonce belongs to the exporter, never to the compiler cache volume key.
      - id: cargo-export
        name: Export reusable Cargo output even when a check failed
        if: ${{ always() && steps.dagger-checks.outcome != 'skipped' && !cancelled() }}
        continue-on-error: true
        timeout-minutes: 6
        run: |
          set -euo pipefail
          # Never export into the directory that seeded this lazy Dagger graph.
          # A cache export is not a check: bound it so a stuck export cannot cancel
          # an otherwise completed gate or suppress the failing check's logs.
          timeout --signal=TERM --kill-after=15s 300s \
            dagger -m ci/dagger/check api call export-cargo-cache \
            --progress plain --nonce "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --output artifacts/linux-cargo
      - name: Report unavailable reusable compilation output
        if: ${{ always() && steps.cargo-export.outcome == 'failure' && !cancelled() }}
        run: |
          echo '::warning::Cargo export failed or timed out. No fresh cache/crate package is claimed; required checks retain their actual outcome.'
          echo 'Cargo output export unavailable. Required checks and native acceptance remain authoritative.' >> "$GITHUB_STEP_SUMMARY"
      - name: Keep actual Cargo diagnostics separate from reusable output
        if: ${{ always() && steps.cargo-export.outcome == 'success' && !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [[ -d artifacts/linux-cargo/check-logs ]]; then
            mv artifacts/linux-cargo/check-logs artifacts/cargo-check-logs
            shopt -s nullglob
            for log in artifacts/cargo-check-logs/*.log; do
              echo "::group::Cargo diagnostics: $(basename "$log")"
              tail -n 100 "$log"
              echo '::endgroup::'
            done
          fi
      - name: Upload actual Cargo output for diagnosis
        if: ${{ always() && steps.cargo-export.outcome == 'success' && !cancelled() }}
        continue-on-error: true
        uses: ./ci/actions/gha-artifact-upload
        with:
          name: chat-hub-cargo-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/cargo-check-logs
          retention-days: 14
      - id: cargo-archive
        name: Archive the Cargo snapshot without changing timestamps or modes
        if: ${{ always() && steps.cargo-export.outcome == 'success' && !cancelled() }}
        continue-on-error: true
        run: python3 ci/scripts/oci_cache.py pack --source artifacts/linux-cargo --output artifacts/cargo-cache
      - name: Retain compiled data for the trusted GHCR publisher
        if: ${{ always() && steps.cargo-archive.outcome == 'success' && !cancelled() }}
        continue-on-error: true
        uses: ./ci/actions/gha-artifact-upload
        with:
          name: chat-hub-cargo-cache-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/cargo-cache
          retention-days: 14
      # Reusable crate objects are separately published and retrieved by source
      # closure. Cargo still verifies fingerprint freshness after each restore;
      # the full snapshot provides shared third-party dependency objects.
      - id: crate-pack
        name: Extract separately addressable compiled outputs for all nine crates
        if: ${{ success() && steps.dagger-checks.outcome == 'success' && steps.cargo-archive.outcome == 'success' }}
        run: >-
          python3 ci/scripts/crate_artifacts.py --source artifacts/linux-cargo
          --cache-manifest artifacts/cargo-cache/cache-manifest.json
          --output artifacts/crates
      - name: Retain model crate objects
        if: ${{ success() && steps.crate-pack.outcome == 'success' }}
        uses: ./ci/actions/gha-artifact-upload
        with:
          name: chat-hub-crate-chat-hub-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/crates/chat-hub-model
          retention-days: 14
      - name: Retain formats crate objects
        if: ${{ success() && steps.crate-pack.outcome == 'success' }}
        uses: ./ci/actions/gha-artifact-upload
        with:
          name: chat-hub-crate-chat-hub-formats-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/crates/chat-hub-formats
          retention-days: 14
      - name: Retain store crate objects
        if: ${{ success() && steps.crate-pack.outcome == 'success' }}
        uses: ./ci/actions/gha-artifact-upload
        with:
          name: chat-hub-crate-chat-hub-store-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/crates/chat-hub-store
          retention-days: 14
      - name: Retain ingest crate objects
        if: ${{ success() && steps.crate-pack.outcome == 'success' }}
        uses: ./ci/actions/gha-artifact-upload
        with:
          name: chat-hub-crate-chat-hub-ingest-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/crates/chat-hub-ingest
          retention-days: 14
      - name: Retain capture crate objects
        if: ${{ success() && steps.crate-pack.outcome == 'success' }}
        uses: ./ci/actions/gha-artifact-upload
        with:
          name: chat-hub-crate-chat-hub-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/crates/chat-hub-capture
          retention-days: 14
      - name: Retain API crate objects
        if: ${{ success() && steps.crate-pack.outcome == 'success' }}
        uses: ./ci/actions/gha-artifact-upload
        with:
          name: chat-hub-crate-chat-hub-api-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/crates/chat-hub-api
          retention-days: 14
      - name: Retain runtime crate objects
        if: ${{ success() && steps.crate-pack.outcome == 'success' }}
        uses: ./ci/actions/gha-artifact-upload
        with:
          name: chat-hub-crate-chat-hub-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/crates/chat-hub-runtime
          retention-days: 14
      - name: Retain CLI crate objects
        if: ${{ success() && steps.crate-pack.outcome == 'success' }}
        uses: ./ci/actions/gha-artifact-upload
        with:
          name: chat-hub-crate-chat-hub-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/crates/chat-hub
          retention-days: 14
      - name: Retain desktop crate objects
        if: ${{ success() && steps.crate-pack.outcome == 'success' }}
        uses: ./ci/actions/gha-artifact-upload
        with:
          name: chat-hub-crate-chat-hub-desktop-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/crates/chat-hub-desktop
          retention-days: 14
      - name: Record the exact successful PR check receipt
        if: ${{ success() && github.event_name == 'pull_request' && steps.dagger-checks.outcome == 'success' }}
        run: python3 build/release_artifact.py check-receipt --root "$GITHUB_WORKSPACE"
      - uses: ./ci/actions/gha-artifact-upload
        if: ${{ success() && github.event_name == 'pull_request' && steps.dagger-checks.outcome == 'success' }}
        with:
          name: chat-hub-check-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/check-receipt.json
          retention-days: 90
