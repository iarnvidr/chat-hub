name: Web SSO quick validation
on:
  pull_request:
    paths:
      - 'crates/chat-hub-web/**'
      - 'desktop-ui/auth.js'
      - 'desktop-ui/index.html'
      - 'docs/dev-web.md'
      - '.github/workflows/web-sso-quick.yml'
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check browser client syntax
        run: node --input-type=module --check < desktop-ui/auth.js
      - name: Install pinned rustfmt
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - name: Format the web server and its Authelia regression tests
        run: rustfmt +1.99.1 --edition 2021 --check crates/chat-hub-web/src/main.rs
