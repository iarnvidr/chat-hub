name: Apple Silicon build (on demand)
on:
  pull_request: # required legacy status only; no macOS runner on PRs
  workflow_dispatch:
    inputs:
      diagnose_oras:
        description: Also run the separate ORAS installation diagnostic (manual branch runs)
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  oras-diagnostic:
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' && inputs.diagnose_oras == true
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Fetch exact workflow revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --quiet "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --quiet --detach "$GITHUB_SHA"
      - name: Diagnose repeated pinned ORAS installation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build/diagnose-oras-install.py "$GITHUB_WORKSPACE/build/install-oras.sh" "$RUNNER_TEMP/chat-hub-oras-diagnostic"
  package-pr:
    # Explicit dispatch on a feature branch is a request for a native preview.
    # A normal PR never starts a macOS runner.
    if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Fetch exact workflow revision
        run: |
          set -euo pipefail
          git init --quiet "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --quiet --detach "$GITHUB_SHA"
      - name: Restore read-only trusted-main Rust compiler cache
        uses: ./ci/actions/cargo-sccache-cache
        with:
          mode: restore
          github-token: ${{ github.token }}
          platform-id: macos-15-arm64
          platform: macos-arm64
          target: aarch64-apple-darwin
      - id: native-build
        name: Build and smoke without package publication
        uses: ./ci/actions/macos-native-build
        with:
          publish-transport: 'false'
      - name: Stage the already-validated PR application and DMG
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          directory="artifacts/pr-macos"
          mkdir -p "$directory"
          app="$RUNNER_TEMP/chat-hub/Chat Hub.app"
          dmg="$RUNNER_TEMP/chat-hub/Chat_Hub_${version}_macos-arm64.dmg"
          test -d "$app"
          test -s "$dmg"
          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$directory/Chat_Hub_${version}_macos-arm64.zip"
          cp "$dmg" "$directory/"
          (cd "$directory" && shasum -a 256 "Chat_Hub_${version}_macos-arm64.zip" "Chat_Hub_${version}_macos-arm64.dmg" > SHA256SUMS)
      - name: Upload installable Apple Silicon PR preview
        uses: actions/upload-artifact@v4
        with:
          name: chat-hub-macos-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/pr-macos
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Record compiler cache hits (no PR cache writes)
        if: always()
        uses: ./ci/actions/cargo-sccache-cache
        with:
          mode: report
          platform-id: macos-15-arm64
          platform: macos-arm64
          target: aarch64-apple-darwin
  package-main:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      transport_digest: ${{ steps.native-build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fetch exact protected-main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --quiet "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags origin "$GITHUB_SHA" '+refs/heads/*:refs/remotes/origin/*'
          git -C "$GITHUB_WORKSPACE" checkout --quiet --detach "$GITHUB_SHA"
      - name: Restore trusted-main Rust compiler cache
        uses: ./ci/actions/cargo-sccache-cache
        with:
          mode: restore
          github-token: ${{ github.token }}
          platform-id: macos-15-arm64
          platform: macos-arm64
          target: aarch64-apple-darwin
      - id: native-build
        name: Build, smoke, and publish trusted-main transport
        uses: ./ci/actions/macos-native-build
        with:
          publish-transport: 'true'
      - name: Publish bounded Rust compiler cache for protected main
        if: success()
        continue-on-error: true
        uses: ./ci/actions/cargo-sccache-cache
        with:
          mode: publish
          github-token: ${{ github.token }}
          platform-id: macos-15-arm64
          platform: macos-arm64
          target: aarch64-apple-darwin
  artifact-transfer:
    needs: package-main
    if: needs.package-main.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
      packages: read
    steps:
      - name: Fetch exact workflow revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --quiet "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --quiet --detach "$GITHUB_SHA"
      - name: Install pinned ORAS client
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash build/install-oras.sh "$RUNNER_TEMP/oras"
      - name: Retrieve and verify exact macOS build transport
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSPORT_DIGEST: ${{ needs.package-main.outputs.transport_digest }}
        run: |
          set -euo pipefail
          test "$TRANSPORT_DIGEST" != ""
          owner="$(printf '%s' "$GITHUB_REPOSITORY" | cut -d/ -f1 | tr '[:upper:]' '[:lower:]')"
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | cut -d/ -f2 | tr '[:upper:]' '[:lower:]')"
          oras="$RUNNER_TEMP/oras/oras"
          printf '%s' "$GH_TOKEN" | "$oras" login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          "$oras" pull "ghcr.io/$owner/chat-hub-ci-$repository@$TRANSPORT_DIGEST" --output "$GITHUB_WORKSPACE/artifact-transport"
          tar -xzf "$GITHUB_WORKSPACE/artifact-transport/chat-hub-transport.tar.gz" -C "$GITHUB_WORKSPACE/artifact-transport"
          python3 - "$GITHUB_WORKSPACE/artifact-transport/transport.json" <<'PY'
          import json, os, sys
          data=json.load(open(sys.argv[1]))
          expected={"repository": os.environ["GITHUB_REPOSITORY"].lower(), "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "sha": os.environ["GITHUB_SHA"]}
          if data != expected:
              raise SystemExit("OCI transport identity does not match this workflow run")
          PY
      - name: Upload optional release startup evidence
        continue-on-error: true
        uses: ./ci/actions/gha-artifact-upload
        with:
          name: chat-hub-macos-release-evidence
          path: artifact-transport/chat-hub-macos-release-evidence
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
      - name: Upload downloadable macOS build
        uses: ./ci/actions/gha-artifact-upload
        with:
          name: chat-hub-macos-arm64
          path: artifact-transport/chat-hub-macos-arm64
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
      - name: Upload accepted native release input
        uses: ./ci/actions/gha-artifact-upload
        with:
          name: chat-hub-native-release-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact-transport/chat-hub-native-release-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
  native-release-gate:
    # This lightweight Linux status retains the name in existing branch protection.
    # It is NOT Apple Silicon acceptance. Only workflow_dispatch runs build macOS.
    name: native-release-gate
    if: always()
    needs: [package-pr, package-main, artifact-transfer]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify on-demand native execution and legacy PR compatibility
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_PACKAGE_RESULT: ${{ needs.package-pr.result }}
          MAIN_PACKAGE_RESULT: ${{ needs.package-main.result }}
          TRANSFER_RESULT: ${{ needs.artifact-transfer.result }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            test "$PR_PACKAGE_RESULT" = skipped
            test "$MAIN_PACKAGE_RESULT" = skipped
            test "$TRANSFER_RESULT" = skipped
            echo 'Apple Silicon was NOT built for this PR; only required Linux checks apply.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$EVENT_NAME" == workflow_dispatch && "$REF" == refs/heads/main ]]; then
            test "$PR_PACKAGE_RESULT" = skipped
            test "$MAIN_PACKAGE_RESULT" = success
            test "$TRANSFER_RESULT" = success
            echo 'Requested main Apple Silicon build, smoke and artifact transfer passed.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            test "$PR_PACKAGE_RESULT" = success
            test "$MAIN_PACKAGE_RESULT" = skipped
            test "$TRANSFER_RESULT" = skipped
            echo 'Requested feature-branch Apple Silicon build and smoke passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Unsupported Apple Silicon workflow event.' >&2
            exit 1
          fi
# Manual native publication remains protected by release.yml.
