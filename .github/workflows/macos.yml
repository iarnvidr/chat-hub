name: Apple Silicon build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.native-scope.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: native-scope
        name: Determine whether native validation is required
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          result="$(python3 build/native_scope.py --root "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA")"
          echo "$result" >> "$GITHUB_STEP_SUMMARY"
          required="$(printf '%s\n' "$result" | sed -n 's/^required=//p')"
          test "$required" = true -o "$required" = false
          echo "required=$required" >> "$GITHUB_OUTPUT"
  package:
    needs: scope
    if: >-
      always() &&
      ((github.event_name == 'pull_request' && needs.scope.result == 'success' && needs.scope.outputs.required == 'true') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Restore helper tool cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/chat-hub-tools
          key: chat-hub-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/tools.lock.json', 'build/ffmpeg_lgpl.py') }}
      - name: Install helper build tools
        run: brew install meson ninja pkgconf
      - name: Select the pinned Rust toolchain and preserve real homes for isolated smoke steps
        run: |
          set -euo pipefail
          rustup show active-toolchain
          echo "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" >> "$GITHUB_ENV"
          echo "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_ENV"
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Early production Tauri compile gate
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets --target aarch64-apple-darwin
      - name: Early native-smoke Tauri compile gate
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets --target aarch64-apple-darwin --features native-smoke
      - name: Build real Tauri app, ad-hoc signed (not notarized)
        run: bash build/build-native-macos.sh "$RUNNER_TEMP/chat-hub"
      - name: Build and mount-verify the DMG with corresponding sources
        run: |
          set -euo pipefail
          python3 build/release_sources.py prepare "$RUNNER_TEMP/chat-hub/corresponding-source"
          version="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          bash build/package-dmg.sh "$RUNNER_TEMP/chat-hub/Chat Hub.app" "$RUNNER_TEMP/chat-hub/corresponding-source" "$RUNNER_TEMP/chat-hub/Chat_Hub_${version}_macos-arm64.dmg"
      - name: Resolve native-smoke Cargo artifact path
        id: native-smoke-artifact
        run: |
          set -euo pipefail
          binary="$(python3 build/native_smoke_artifact.py src-tauri/Cargo.toml)"
          test -n "$binary"
          echo "binary=$binary" >> "$GITHUB_OUTPUT"
      - name: Compile native-smoke feature (required)
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin --features native-smoke
      - name: Build debug binary for native UI interactions
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin --features native-smoke
      - id: prepare-debug-smoke
        name: Prepare isolated debug bundle for native smokes
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/chat-hub-debug-smoke/Chat Hub.app"
          mkdir -p "$(dirname "$app")"
          ditto "$RUNNER_TEMP/chat-hub/Chat Hub.app" "$app"
          exe="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          debug_binary="${{ steps.native-smoke-artifact.outputs.binary }}"
          test -x "$debug_binary"
          cp "$debug_binary" "$app/Contents/MacOS/$exe"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")" = "$exe"
          cmp -s "$debug_binary" "$app/Contents/MacOS/$exe"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
      - name: Required native library persisted-data smoke (debug bundle only)
        id: native-library-smoke
        env:
          NATIVE_LIBRARY_EVIDENCE_DIR: ${{ runner.temp }}/chat-hub-native-library-evidence
        run: |
          set -euo pipefail
          MUNINN_E2E_DIR="$(mktemp -d "$RUNNER_TEMP/chat-hub-native-library-e2e.XXXXXX")"
          export MUNINN_E2E_DIR
          mkdir -p "$NATIVE_LIBRARY_EVIDENCE_DIR"
          home="$(python3 -c 'import os,pwd; print(pwd.getpwuid(os.getuid()).pw_dir)')"
          if bash build/native-library-smoke.sh "$RUNNER_TEMP/chat-hub-debug-smoke/Chat Hub.app" "$NATIVE_LIBRARY_EVIDENCE_DIR" --allow-default-app-data --disposable-home "$home"; then
            echo "native library smoke: ran (success)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            rc=$?
            echo "native library smoke: ran (failure, exit $rc)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit "$rc"
          fi
      - name: Required release app launch and localhost health smoke
        env:
          SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/chat-hub-release-evidence
        run: bash build/smoke-native-macos.sh "$RUNNER_TEMP/chat-hub/Chat Hub.app"
      - id: updater-smoke
        if: ${{ !cancelled() && steps['prepare-debug-smoke'].outcome == 'success' }}
        name: Native signed updater integration smoke (debug bundle)
        env:
          MUNINN_UPDATER_SMOKE_APP: ${{ runner.temp }}/chat-hub-debug-smoke/Chat Hub.app
          MUNINN_UPDATER_SMOKE_EVIDENCE_DIR: ${{ runner.temp }}/chat-hub-updater-evidence
        run: bash build/updater-smoke/run-macos.sh
      - name: Required native launch, UI, API, update status, reopen, shutdown smoke (debug bundle)
        env:
          HOME: ${{ runner.temp }}/chat-hub-launch-home
          RUSTUP_HOME: ${{ env.RUSTUP_HOME }}
          CARGO_HOME: ${{ env.CARGO_HOME }}
          NATIVE_LAUNCH_EVIDENCE_DIR: ${{ runner.temp }}/chat-hub-native-launch-evidence
        run: |
          set -uo pipefail
          final_rc=1
          for attempt in 1 2; do
            evidence="$RUNNER_TEMP/chat-hub-native-launch-evidence/attempt-$attempt"
            set +e
            bash build/native-launch-smoke.sh "$RUNNER_TEMP/chat-hub-debug-smoke/Chat Hub.app" "$evidence" basic
            rc=$?
            set -e
            echo "Required native launch smoke attempt $attempt exit code: $rc; evidence: $evidence" | tee -a "$GITHUB_STEP_SUMMARY"
            final_rc=$rc
            if [ "$rc" -eq 0 ]; then break; fi
          done
          exit "$final_rc"
      - name: Advisory provider proxy capture and denial smoke (debug bundle)
        continue-on-error: true
        if: ${{ !cancelled() && steps['prepare-debug-smoke'].outcome == 'success' }}
        env:
          HOME: ${{ runner.temp }}/chat-hub-provider-home
          RUSTUP_HOME: ${{ env.RUSTUP_HOME }}
          CARGO_HOME: ${{ env.CARGO_HOME }}
          NATIVE_LAUNCH_EVIDENCE_DIR: ${{ runner.temp }}/chat-hub-provider-evidence
        run: |
          set +e
          bash build/native-launch-smoke.sh "$RUNNER_TEMP/chat-hub-debug-smoke/Chat Hub.app" "$RUNNER_TEMP/chat-hub-provider-evidence" full
          rc=$?
          echo "::warning::Advisory provider proxy capture/denial smoke exited $rc; provider interception is not yet verified on macOS."
          echo "Provider proxy capture/denial advisory exit code: $rc" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Optional updater UI interaction smoke (debug bundle only)
        continue-on-error: true
        if: ${{ !cancelled() && steps['prepare-debug-smoke'].outcome == 'success' }}
        env:
          NATIVE_UI_EVIDENCE_DIR: ${{ runner.temp }}/chat-hub-debug-ui-evidence
        run: bash build/native-ui-smoke.sh "$RUNNER_TEMP/chat-hub-debug-smoke/Chat Hub.app" "$RUNNER_TEMP/chat-hub-debug-ui-evidence"
      - name: Prepare allowlisted release and native smoke evidence
        if: always()
        run: |
          args=()
          args+=(--native-library-source "$RUNNER_TEMP/chat-hub-native-library-evidence")
          python3 build/prepare-native-evidence.py "$RUNNER_TEMP/chat-hub-safe-evidence" "$RUNNER_TEMP/chat-hub-release-evidence" "$RUNNER_TEMP/chat-hub-native-launch-evidence" "$RUNNER_TEMP/chat-hub-debug-ui-evidence" "$RUNNER_TEMP/chat-hub-provider-evidence" "$RUNNER_TEMP/chat-hub-updater-evidence" "${args[@]}"
      - name: Upload release startup evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat-hub-macos-release-evidence
          path: |
            ${{ runner.temp }}/chat-hub-safe-evidence/**
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
      - id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat-hub-macos-arm64
          path: |
            ${{ runner.temp }}/chat-hub/Chat Hub.app/**
            ${{ runner.temp }}/chat-hub-safe-evidence/**
            ${{ runner.temp }}/chat-hub/Chat_Hub_*.zip
            ${{ runner.temp }}/chat-hub/Chat_Hub_*.zip.sha256
            ${{ runner.temp }}/chat-hub/Chat_Hub_*.dmg
            ${{ runner.temp }}/chat-hub/verify-macos.txt
            ${{ runner.temp }}/chat-hub-safe-evidence/**
          if-no-files-found: error
          # Builds of main stay downloadable for a month; PR builds for a week.
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
      - name: Retain accepted native release input
        run: |
          version="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/chat-hub/Chat Hub.app" "artifacts/Chat_Hub_${version}_macos-arm64.zip"
          (cd artifacts && shasum -a 256 "Chat_Hub_${version}_macos-arm64.zip" > "Chat_Hub_${version}_macos-arm64.zip.sha256")
          cp "$RUNNER_TEMP/chat-hub/Chat_Hub_${version}_macos-arm64.dmg" artifacts/
          python3 build/release_artifact.py receipt
      - name: Upload accepted native release input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chat-hub-native-release-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 90
      - name: Show where to download this build
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "### Chat Hub test build (Apple Silicon)"
            echo
            echo "Download: [chat-hub-macos-arm64]($ARTIFACT_URL) (sign in to GitHub; includes release archive/checksum and separate debug UI smoke evidence)."
            echo "Not a release: ad-hoc signed and not notarized. See README, Install on the Mac."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Download: $ARTIFACT_URL"
  native-release-gate:
    name: native-release-gate
    if: always() && (github.event_name == 'pull_request' ||
                     (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    needs: [scope, package]
    runs-on: ubuntu-24.04
    steps:
      - name: Require native build for in-scope changes and main manual builds
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          NATIVE_REQUIRED: ${{ needs.scope.outputs.required }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            test "$SCOPE_RESULT" = success || { echo "Native scope evaluation failed; failing closed." >&2; exit 1; }
            case "$NATIVE_REQUIRED" in
              true) test "$PACKAGE_RESULT" = success || { echo "Native changes require the complete macOS build and smoke suite." >&2; exit 1; } ;;
              false) test "$PACKAGE_RESULT" = skipped || { echo "Unexpected native package result for out-of-scope changes." >&2; exit 1; } ;;
              *) echo "Native scope result is missing or malformed." >&2; exit 1 ;;
            esac
          elif [[ "$EVENT_NAME" == workflow_dispatch && "$REF" == refs/heads/main ]]; then
            test "$PACKAGE_RESULT" = success || { echo "Trusted-main manual native build did not succeed." >&2; exit 1; }
          else
            echo "Unsupported event/ref for required native gate." >&2
            exit 1
          fi
# Deliberately no automatic GitHub release. See docs/PUBLICATION.md before releasing.
