name: Apple Silicon build
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      required: ${{ steps.native-scope.outputs.required }}
    steps:
      - name: Fetch exact workflow revision
        run: |
          set -euo pipefail
          git init --quiet "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --quiet --detach "$GITHUB_SHA"
      - id: native-scope
        name: Determine whether native validation is required
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          result="$(python3 build/native_scope.py --root "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA")"
          echo "$result" >> "$GITHUB_STEP_SUMMARY"
          required="$(printf '%s\n' "$result" | sed -n 's/^required=//p')"
          test "$required" = true -o "$required" = false
          echo "required=$required" >> "$GITHUB_OUTPUT"
  package-pr:
    needs: scope
    if: >-
      github.event_name == 'pull_request' &&
      needs.scope.result == 'success' &&
      needs.scope.outputs.required == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Fetch exact workflow revision
        run: |
          set -euo pipefail
          git init --quiet "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --no-tags origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --quiet --detach "$GITHUB_SHA"
      - name: Restore read-only trusted-main Rust compiler cache
        uses: ./ci/actions/cargo-sccache-cache
        with:
          mode: restore
          github-token: ${{ github.token }}
          platform-id: macos-15-arm64
          platform: macos-arm64
          target: aarch64-apple-darwin
      - id: native-build
        name: Build and smoke without package publication
        uses: ./ci/actions/macos-native-build
        with:
          publish-transport: 'false'
      - name: Record compiler cache hits (no PR cache writes)
        if: always()
        uses: ./ci/actions/cargo-sccache-cache
        with:
          mode: report
          platform-id: macos-15-arm64
          platform: macos-arm64
          target: aarch64-apple-darwin
  package-main:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 60
    concurrency:
      group: chat-hub-sccache-macos-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      transport_digest: ${{ steps.native-build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Fetch exact protected-main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --quiet "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags origin "$GITHUB_SHA" '+refs/heads/*:refs/remotes/origin/*'
          git -C "$GITHUB_WORKSPACE" checkout --quiet --detach "$GITHUB_SHA"
      - name: Restore trusted-main Rust compiler cache
        uses: ./ci/actions/cargo-sccache-cache
        with:
          mode: restore
          github-token: ${{ github.token }}
          platform-id: macos-15-arm64
          platform: macos-arm64
          target: aarch64-apple-darwin
      - id: native-build
        name: Build, smoke, and publish trusted-main transport
        uses: ./ci/actions/macos-native-build
        with:
          publish-transport: 'true'
      - name: Publish bounded Rust compiler cache for protected main
        if: success()
        continue-on-error: true
        uses: ./ci/actions/cargo-sccache-cache
        with:
          mode: publish
          github-token: ${{ github.token }}
          platform-id: macos-15-arm64
          platform: macos-arm64
          target: aarch64-apple-darwin
  artifact-transfer:
    needs: package-main
    if: needs.package-main.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
      packages: read
    steps:
      - name: Fetch exact workflow revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --quiet "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags origin "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" checkout --quiet --detach "$GITHUB_SHA"
      - name: Install pinned ORAS client
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash build/install-oras.sh "$RUNNER_TEMP/oras"
      - name: Retrieve and verify exact macOS build transport
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSPORT_DIGEST: ${{ needs.package-main.outputs.transport_digest }}
        run: |
          set -euo pipefail
          test "$TRANSPORT_DIGEST" != ""
          owner="$(printf '%s' "$GITHUB_REPOSITORY" | cut -d/ -f1 | tr '[:upper:]' '[:lower:]')"
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | cut -d/ -f2 | tr '[:upper:]' '[:lower:]')"
          oras="$RUNNER_TEMP/oras/oras"
          printf '%s' "$GH_TOKEN" | "$oras" login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          "$oras" pull "ghcr.io/$owner/chat-hub-ci-$repository@$TRANSPORT_DIGEST" --output "$GITHUB_WORKSPACE/artifact-transport"
          tar -xzf "$GITHUB_WORKSPACE/artifact-transport/chat-hub-transport.tar.gz" -C "$GITHUB_WORKSPACE/artifact-transport"
          python3 - "$GITHUB_WORKSPACE/artifact-transport/transport.json" <<'PY'
          import json, os, sys
          data=json.load(open(sys.argv[1]))
          expected={"repository": os.environ["GITHUB_REPOSITORY"].lower(), "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "sha": os.environ["GITHUB_SHA"]}
          if data != expected:
              raise SystemExit("OCI transport identity does not match this workflow run")
          PY
      - name: Upload optional release startup evidence
        continue-on-error: true
        uses: ./ci/actions/gha-artifact-upload
        with:
          name: chat-hub-macos-release-evidence
          path: artifact-transport/chat-hub-macos-release-evidence
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
      - name: Upload downloadable macOS build
        uses: ./ci/actions/gha-artifact-upload
        with:
          name: chat-hub-macos-arm64
          path: artifact-transport/chat-hub-macos-arm64
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 30 }}
      - name: Upload accepted native release input
        uses: ./ci/actions/gha-artifact-upload
        with:
          name: chat-hub-native-release-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifact-transport/chat-hub-native-release-${{ github.event_name == 'pull_request' && 'pr' || 'main' }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
  native-release-gate:
    name: native-release-gate
    if: always() && (github.event_name == 'pull_request' ||
                     (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    needs: [scope, package-pr, package-main, artifact-transfer]
    runs-on: ubuntu-24.04
    steps:
      - name: Require native build for in-scope changes and main manual builds
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          NATIVE_REQUIRED: ${{ needs.scope.outputs.required }}
          PR_PACKAGE_RESULT: ${{ needs.package-pr.result }}
          MAIN_PACKAGE_RESULT: ${{ needs.package-main.result }}
          TRANSFER_RESULT: ${{ needs.artifact-transfer.result }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            test "$SCOPE_RESULT" = success || { echo "Native scope evaluation failed; failing closed." >&2; exit 1; }
            case "$NATIVE_REQUIRED" in
              true) test "$PR_PACKAGE_RESULT" = success && test "$MAIN_PACKAGE_RESULT" = skipped && test "$TRANSFER_RESULT" = skipped || { echo "Native changes require the complete unprivileged macOS build and smoke suite; PR artifacts are unavailable without a Node-free runner path." >&2; exit 1; } ;;
              false) test "$PR_PACKAGE_RESULT" = skipped && test "$MAIN_PACKAGE_RESULT" = skipped && test "$TRANSFER_RESULT" = skipped || { echo "Unexpected native package or artifact transfer result for out-of-scope changes." >&2; exit 1; } ;;
              *) echo "Native scope result is missing or malformed." >&2; exit 1 ;;
            esac
          elif [[ "$EVENT_NAME" == workflow_dispatch && "$REF" == refs/heads/main ]]; then
            test "$PR_PACKAGE_RESULT" = skipped && test "$MAIN_PACKAGE_RESULT" = success && test "$TRANSFER_RESULT" = success || { echo "Trusted-main native build and artifact transfer did not succeed." >&2; exit 1; }
          else
            echo "Unsupported event/ref for required native gate." >&2
            exit 1
          fi
# Deliberately no automatic GitHub release. See docs/PUBLICATION.md before releasing.
