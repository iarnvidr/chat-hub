[package]
name = "chat-hub-api"
# The HTTP version endpoint reports the application version, not a library ABI.
version = "0.2.5"
edition = "2021"
license = "Apache-2.0"
publish = false

[features]
test-support = []

[dependencies]
chat-hub-model = { path = "../chat-hub-model", version = "0.1.0" }
chat-hub-store = { path = "../chat-hub-store", version = "0.1.0" }
chat-hub-ingest = { path = "../chat-hub-ingest", version = "0.1.0" }
axum = "0.7"
http-body-util = "0.1"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }

[dev-dependencies]
hyper = { version = "1", features = ["http1"] }
tower = { version = "0.5", features = ["util"] }
