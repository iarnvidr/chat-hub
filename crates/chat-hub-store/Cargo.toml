[package]
name = "chat-hub-store"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
chat-hub-model = { path = "../chat-hub-model", version = "0.1.0" }
chat-hub-formats = { path = "../chat-hub-formats", version = "0.1.0" }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
