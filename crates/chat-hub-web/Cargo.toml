[package]
name = "chat-hub-web"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
axum = "0.7"
chat-hub-api = { path = "../chat-hub-api", version = "0.2.5" }
chat-hub-store = { path = "../chat-hub-store", version = "0.1.0" }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.5", features = ["fs", "set-header"] }
ring = "0.17"
subtle = "2"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
