<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Chat Hub</title><style>body{font:16px system-ui;background:#f6f5f2;color:#252525;margin:0}main{max-width:980px;margin:8vh auto;padding:32px;background:white;border-radius:18px;box-shadow:0 8px 30px #0001}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:30px}.card{margin-top:30px;padding:22px;border:1px solid #ddd;border-radius:12px}button,select{padding:10px 15px;border:0;border-radius:8px;background:#283b49;color:white;font-weight:600;cursor:pointer}#message{margin-top:15px;color:#54616b}#health{font-size:14px;color:#666}</style></head><body><main><header><h1>Chat Hub</h1><span id="version" data-testid="app-version">Loading…</span></header><p>Your conversations, stored locally and ready to search.</p><div id="health">Starting local service…</div><section class="card"><h2>Software updates</h2><p>Channel: Stable. Prerelease updates are unsupported; install previews manually.</p> <button id="check" data-testid="check-updates">Check for updates</button> <button id="install" hidden>Update &amp; relaunch</button><div id="message" data-testid="update-message" role="status">Checking version…</div></section></main><script type="module">
const invoke=(...args)=>window.__TAURI_INTERNALS__?.invoke(...args); window.ChatHub={invoke}; const $=id=>document.getElementById(id); async function status(){if(!invoke){$('message').textContent='Desktop bridge unavailable';return}try{let s=await invoke('update_status');let service=await invoke('service_info');$('version').textContent='Version '+s.version;$('message').textContent=s.message;$('health').textContent='Local service is starting.'}catch(e){$('health').textContent='Local service unavailable: '+e}}
$('check').onclick=async()=>{ $('message').textContent='Checking…';$('install').hidden=true;try{let s=await invoke('check_for_updates');$('message').textContent=s.message;if(s.status==='available')$('install').hidden=false}catch(e){$('message').textContent='Update check failed: '+e}};
$('install').onclick=async()=>{ $('message').textContent='Verifying and installing signed update…';try{await invoke('install_update')}catch(e){$('message').textContent='Update failed: '+e}};status();setTimeout(()=>$('check').click(),1200);
</script></body></html>
