name: Reuse verified Rust compilation outputs
description: Restore and publish a bounded sccache directory through protected-main GHCR OCI tags.
inputs:
  mode:
    description: restore before compiling, report after compiling, or publish from trusted main.
    required: true
  github-token:
    description: Job-scoped GHCR token. Read-only for PR restore and write-enabled only for protected main.
    required: false
    default: ''
  platform-id:
    description: Stable runner identity included in the cache contract.
    required: true
  platform:
    description: Pinned sccache release platform identifier.
    required: true
  target:
    description: Rust target triple included in the cache contract.
    required: true
runs:
  using: composite
  steps:
    - name: Install pinned compiler wrapper and prepare cache contract
      if: ${{ inputs.mode == 'restore' }}
      shell: bash
      run: >-
        python3 "$GITHUB_WORKSPACE/ci/scripts/compiled_cache.py" prepare
        --root "$GITHUB_WORKSPACE"
        --platform "${{ inputs.platform }}"
        --platform-id "${{ inputs['platform-id'] }}"
        --target "${{ inputs.target }}"
        --cache-dir "$RUNNER_TEMP/chat-hub-sccache/cache"
        --state-dir "$RUNNER_TEMP/chat-hub-sccache/state"
        --github-env "$GITHUB_ENV"
        --summary "$GITHUB_STEP_SUMMARY"
    - name: Install pinned ORAS client
      id: oras
      if: ${{ inputs.mode == 'restore' || inputs.mode == 'publish' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -u
        installer="$GITHUB_WORKSPACE/build/install-oras.sh"
        cache_dir="$RUNNER_TEMP/chat-hub-oras"
        shared_dir="$RUNNER_TEMP/oras"
        cache_error="$RUNNER_TEMP/chat-hub-oras-install.stderr"
        shared_error="$RUNNER_TEMP/oras-install.stderr"
        if path="$(bash "$installer" "$cache_dir" 2>"$cache_error")"; then
          echo "path=$path" >> "$GITHUB_OUTPUT"
        elif path="$(bash "$installer" "$shared_dir" 2>"$shared_error")"; then
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "Reused the previously checksum-verified ORAS 1.2.3 binary from the package transport installer." >> "$GITHUB_STEP_SUMMARY"
        else
          install_status=$?
          echo "path=" >> "$GITHUB_OUTPUT"
          echo "Pinned ORAS unavailable (cache destination and shared runner destination failed; final installer exit $install_status). Cache transfer will be skipped." >> "$GITHUB_STEP_SUMMARY"
          python3 - "$cache_error" "$shared_error" <<'PY'
import os, re, sys
token = os.environ.get("GH_TOKEN", "")
lines = []
for name in sys.argv[1:]:
    try:
        value = open(name, encoding="utf-8", errors="replace").read()
    except OSError:
        continue
    if token:
        value = value.replace(token, "[redacted]")
    value = re.sub(r"(?i)bearer\s+\S+", "Bearer [redacted]", value)
    value = re.sub(r"(?i)(token|access_token|authorization)=([^\s&]+)", r"\1=[redacted]", value)
    lines.extend(line.strip() for line in value.splitlines() if line.strip())
print("ORAS installer diagnostic (sanitized): " + (" | ".join(lines[-3:])[:600] if lines else "(no stderr)"))
PY
        fi
    - name: Restore protected-main compiler cache
      if: ${{ inputs.mode == 'restore' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: >-
        python3 "$GITHUB_WORKSPACE/ci/scripts/compiled_cache.py" pull
        --state-dir "$RUNNER_TEMP/chat-hub-sccache/state"
        --oras "${{ steps.oras.outputs.path }}"
        --summary "$GITHUB_STEP_SUMMARY"
    - name: Record compiler-cache hit evidence
      if: ${{ inputs.mode == 'report' }}
      shell: bash
      run: >-
        python3 "$GITHUB_WORKSPACE/ci/scripts/compiled_cache.py" report
        --state-dir "$RUNNER_TEMP/chat-hub-sccache/state"
        --summary "$GITHUB_STEP_SUMMARY"
    - name: Publish compiler cache from protected main only
      if: ${{ inputs.mode == 'publish' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: >-
        python3 "$GITHUB_WORKSPACE/ci/scripts/compiled_cache.py" publish
        --state-dir "$RUNNER_TEMP/chat-hub-sccache/state"
        --oras "${{ steps.oras.outputs.path }}"
        --summary "$GITHUB_STEP_SUMMARY"
